# Target

qemu_x86_64_vsock:
    sdk:
        defconfig: "materials/configs/sdk/qemu_x86_64_defconfig"
        toolchain_archive: "x86_64-buildroot-linux-gnu_sdk-buildroot.tar.gz"
    image:
        defconfig: "materials/configs/image/qemu_x86_64_vsock_defconfig"

    run:
      - export PATH="/buildroot-home/target-builds/qemu_x86_64/host/bin:${PATH}"
      - cd /buildroot-home/target-builds/qemu_x86_64/images
      - qemu-system-x86_64 -M pc -enable-kvm -kernel bzImage -drive file=rootfs.ext2,if=virtio,format=raw -append "rootwait root=/dev/vda console=ttyS0" -serial mon:stdio -net nic,model=virtio -net user -nographic -device vhost-vsock-pci,id=vhost-vsock-pci0,guest-cid=3

    nproc: 4

qemu_x86_64_xorg:
    sdk:
        defconfig: "materials/configs/sdk/qemu_x86_64_defconfig"
        toolchain_archive: "x86_64-buildroot-linux-gnu_sdk-buildroot.tar.gz"
    image:
        defconfig: "materials/configs/image/qemu_x86_64_xorg_defconfig"

    run:
      - export PATH="/buildroot-home/target-builds/qemu_x86_64_xorg/host/bin:${PATH}"
      - cd /buildroot-home/target-builds/qemu_x86_64_xorg/images
      - qemu-system-x86_64 -M pc -m 1024 -enable-kvm -kernel bzImage -drive file=rootfs.ext2,if=virtio,format=raw -append "rootwait root=/dev/vda console=ttyS0" -serial mon:stdio -net nic,model=virtio -net user -display none -vnc 0.0.0.0:0 -device VGA -device usb-ehci -device usb-kbd -device usb-tablet

    nproc: 4

qemu_x86_64_weston:
    sdk:
        defconfig: "materials/configs/sdk/qemu_x86_64_defconfig"
        toolchain_archive: "x86_64-buildroot-linux-gnu_sdk-buildroot.tar.gz"
    image:
        defconfig: "materials/configs/image/qemu_x86_64_weston_defconfig"
    nproc: 4

    run:
      - export PATH="/buildroot-home/target-builds/qemu_x86_64_weston/host/bin:${PATH}"
      - cd /buildroot-home/target-builds/qemu_x86_64_weston/images
      - qemu-system-x86_64 -M pc -enable-kvm -m 1024 -kernel bzImage -drive file=rootfs.ext2,format=raw,if=ide -append "root=/dev/sda rw console=ttyS0" -serial mon:stdio -net nic,model=virtio -net user -display none -vnc 0.0.0.0:0 -device VGA -device usb-ehci -device usb-kbd -device usb-tablet
